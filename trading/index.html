<style>

.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}

.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.sup{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:#fff}

.bubble .tr{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.bubble.mailb{border:1px solid var(--line);background:#fff}
.typing{font-size:11px;color:var(--amber)}
.result{font-size:11.5px;font-weight:600}
.setrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}

.formula{font-size:11px;color:var(--muted);margin-top:8px}

.ontime{color:var(--ok)}
.doc{border:1px solid var(--line);border-radius:6px;padding:28px 30px;background:#fff;box-shadow:0 6px 20px #22333a10;max-width:800px}

.doc-parties{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px 0 6px}
