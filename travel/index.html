<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>見積・手配ワークスペース｜Nova Strategy</title>
<meta name="description" content="お客様からの見積依頼メールから、料金表での積算・タイ語LINEでの空き確認・見積書と行程表・確定後のバウチャーまで。ツアー紹介のSNS投稿も自動で下書き。旅行会社・ランドオペレーター向けの業務デモ。">
<style>
:root{--bg:#f6f8f8;--paper:#fff;--ink:#21363a;--muted:#77878a;--line:#e3eaea;--green:#1d6b67;--green-2:#15524f;--green-light:#e7f3f1;--amber:#926417;--amber-light:#fff5df;--red:#b04438;--red-light:#fbeae6;--blue:#476c9f;--blue-light:#e9f0fb;--nav:192px;
--font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.65 var(--font);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;white-space:nowrap;transition:background .15s}
button:hover:not(:disabled){background:#eff6f5}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7dbdb6;outline-offset:2px}
.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.primary:hover:not(:disabled){background:var(--green-2)}
.small{font-size:11px;padding:5px 9px}
.muted{color:var(--muted)}.tiny{font-size:11px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.btn-i{display:inline-flex;align-items:center;gap:7px}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:22px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-symbol{width:31px;height:31px;background:var(--green);border-radius:9px;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0}
.brand b{font-size:15px;letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.brand small{display:block;font-size:9px;line-height:1.2;letter-spacing:.16em;color:#6b7c7a}
.crumb{font-size:12px;color:#7b8b89;flex:1}
.demo-pill{background:#f8f2df;color:#856e30;font-size:11px;border-radius:6px;padding:4px 8px;white-space:nowrap}
.help{border:0;background:none;display:flex;gap:6px;align-items:center;font-size:12px}
.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:var(--nav) minmax(0,1fr)}
.nav{border-right:1px solid var(--line);padding:22px 12px;background:#f2f6f6;display:flex;flex-direction:column;gap:6px}
.nav-label{font-size:10px;letter-spacing:.12em;color:#859392;padding:0 12px 10px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;padding:11px 12px;background:none;border-radius:8px;font-weight:500;font-size:12.5px;width:100%}
.nav button.active{background:#d9ebe8;color:#15524f}
.nav button:hover{background:#e4efed}
.nav .count:empty{display:none}.nav .count{margin-left:auto;background:#fff9;border-radius:6px;padding:0 6px;font-size:10px}
.nav .count.hot{background:var(--green);color:#fff}
.nav-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.nav .note{font-size:9.5px;color:#829190;padding:12px 12px 0;line-height:1.6}
.workspace{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ws-head{min-height:72px;flex-shrink:0;display:flex;align-items:center;padding:10px 26px;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);gap:16px}
.ws-head h1{font-size:19px;line-height:1.5;margin:0;font-weight:600}
.ws-head p{font-size:11px;color:#7b8988;margin:2px 0 0}
.body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.list-pane{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.list-tools{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:16px;padding-top:4px}
.tabs button{border:0;background:none;padding:6px 0;border-bottom:2px solid transparent;border-radius:0;color:#829088;font-size:11.5px}
.tabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.scroll{overflow:auto;flex:1;min-height:0}
.row{width:100%;display:block;border:0;border-bottom:1px solid #edf1f0;border-radius:0;text-align:left;padding:15px 17px;white-space:normal;background:#fff}
.row.active{background:#edf6f4;box-shadow:3px 0 0 var(--green) inset}
.row:hover{background:#f4f8f7}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.row-top b{font-size:11.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-top time{font-size:10px;color:#8a9695}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.row .subj{font-size:12.5px;font-weight:500;line-height:1.6;margin:2px 0}
.row .snip{font-size:11px;color:#8c9695;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.row-foot{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:500;white-space:nowrap;line-height:1.7}
.badge.green{background:#e1f1ee;color:#1d6b67}.badge.amber{background:var(--amber-light);color:var(--amber)}.badge.blue{background:var(--blue-light);color:var(--blue)}.badge.gray{background:#f0f2f2;color:#7e8989}.badge.red{background:var(--red-light);color:#a65a4b}
.list-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.detail{min-width:0;overflow:auto;background:#fff}
.detail-inner{padding:24px 30px 40px;max-width:1000px}
.mail-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mail-h h2{font-size:19px;margin:0 0 14px;font-weight:600;line-height:1.5}
.sender{display:flex;gap:11px;align-items:center;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e4efed;color:#2d6863;display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.sender b{font-size:12.5px;display:block}.sender span{font-size:11px;color:var(--muted)}
.sender time{margin-left:auto;font-size:11px;color:var(--muted)}
.mail-body{white-space:pre-wrap;font-size:13px;line-height:1.95;border-bottom:1px solid var(--line);padding-bottom:20px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.reply{border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}
.reply-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;background:#fafbfb;flex-wrap:wrap}
.reply-h input{border:0;background:transparent;flex:1;min-width:160px;padding:2px}
.reply textarea{width:100%;border:0;min-height:240px;padding:14px;resize:vertical;line-height:1.8;font-size:12.5px;background:#fff}
.reply-f{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfb;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green);border-radius:6px;padding:3px 9px;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .em-i{width:58px;height:58px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;color:var(--green);background:#fff}
.empty h3{color:var(--ink);font-size:16px;font-weight:500;margin:0 0 6px}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.p-head h2{margin:0;font-size:18px;font-weight:600}
.p-head .meta{font-size:11px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.step{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#8a9796;border:0;background:none;padding:6px 0;text-align:left;border-radius:0;border-top:3px solid #e3ebea;white-space:normal}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid #cfd9d8;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.step.done{border-color:#9fcac4;color:#3a6c67}.step.done i{background:#9fcac4;color:#fff;border-color:#9fcac4}
.step.cur{border-color:var(--green);color:var(--green);font-weight:600}.step.cur i{background:var(--green);color:#fff;border-color:var(--green)}
.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.ptabs button{border:0;background:none;border-radius:0;padding:9px 0;border-bottom:2px solid transparent;color:#7d8a89;font-size:12px}
.ptabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin-top:14px}
.card h3{font-size:13.5px;margin:0 0 10px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;border-bottom:0}
.kv th{width:26%}
.checklist{background:var(--amber-light);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:12px}
.checklist b{color:var(--amber)}
.checklist ul{margin:4px 0 0;padding-left:20px}
.slots{display:grid;gap:12px;margin-top:12px}
.slot{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.slot-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-h b{font-size:13px}
.slot .spec{font-size:11.5px;color:#5f6d6b;margin:3px 0 6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--green-light);color:var(--green)}
.chip.no{background:#f3f3f1;color:#9a8f7a;text-decoration:line-through}
.chip.wait{background:#f0f2f2;color:#7e8989}
.thread{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.thread .who{font-size:10.5px;color:var(--muted)}
.bubble{border-radius:10px;padding:8px 11px;font-size:12px;max-width:540px;line-height:1.7;white-space:pre-wrap}
.bubble.out{background:#e3f3ef;align-self:flex-end}
.bubble.in{background:#f2f3f5;align-self:flex-start}
.bubble .tr{display:block;color:var(--muted);font-size:11px;margin-top:4px;border-top:1px solid #0000000d;padding-top:4px}
.vac{font-size:11px;font-weight:600}
.doc{border:1px solid var(--line);border-radius:6px;padding:28px 30px;background:#fff;box-shadow:0 6px 20px #21363a0d;max-width:780px}
.doc h4{margin:0;font-size:18px}
.doc h5{margin:20px 0 6px;font-size:13.5px;border-left:3px solid var(--green);padding-left:8px}
.doc .to{font-size:13px;margin:14px 0 4px}
.doc .lead{font-size:12px;color:#5d6b69;margin:0 0 10px}
.doc table{font-size:12px}
.doc .big{font-size:15px;font-weight:700;color:var(--green)}
.doc-wrap{background:#fbfcfc}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note-box{background:#f7f9f9;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.75}
.note-box b{display:block;margin-bottom:2px;font-size:12px}
.day{margin-top:10px}
.day-h{font-weight:600;font-size:12.5px;background:#f2f7f6;border-radius:6px;padding:4px 10px}
.route{display:grid;gap:2px;margin:6px 0 0 4px}
.route div{display:grid;grid-template-columns:48px 14px minmax(0,1fr);gap:8px;font-size:12px;align-items:start}
.route .pt{width:9px;height:9px;border-radius:50%;background:var(--green);margin:6px auto 0}
.route .sub{display:block;color:var(--muted);font-size:11px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.voucher{border:1px dashed #9cc4bf;border-radius:10px;padding:10px 12px;font-size:12px;background:#fbfdfd}
.voucher .vh{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.voucher b{font-size:13px;display:block;margin:2px 0}
.voucher .ref{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.diff{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.diff s{color:var(--muted)}
.foot-bar{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:12px 30px;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.foot-bar .sum{margin-right:auto;font-size:11.5px;color:var(--muted)}
.foot-bar .sum b{color:var(--ink)}
.sns-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.post-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-width:440px}
.post-prev .ph{display:flex;gap:9px;align-items:center;padding:10px 12px;font-size:12px}
.post-prev .ph .avatar{width:28px;height:28px;font-size:11px;background:var(--green);color:#fff}
.post-prev .tx{white-space:pre-wrap;padding:4px 12px 12px;font-size:12.5px;line-height:1.75}
.ig-card{aspect-ratio:1/1;background:#f3ede2;color:#2d3b3a;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ig-card .k{font-size:11px;letter-spacing:.18em;color:#8a7a5c}
.ig-card .t{font-size:22px;font-weight:700;line-height:1.4}
.ig-card .p{font-size:13px;border-top:1px solid #d8ccb4;padding-top:10px;color:#5b5444}
.line-prev{background:#8faecf;border-radius:12px;padding:14px;max-width:440px}
.line-prev .lb{background:#fff;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:12.5px;line-height:1.75}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:11.5px}
.seg button.on{background:var(--green);color:#fff}
select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.cal{display:grid;gap:6px}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.cal-day b{font-size:11.5px}
.cal-day .it{font-size:11px;margin-top:4px;display:flex;gap:6px;align-items:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:6px 0}
.toggle input{margin-top:3px;accent-color:var(--green)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f3437;color:#fff;border-radius:10px;padding:10px 16px;font-size:12.5px;box-shadow:0 8px 24px #0003;z-index:50;max-width:92vw}
.modal-bg{position:fixed;inset:0;background:#1d2b2b80;z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal h4{margin:16px 0 6px;font-size:13px}
.modal ol{padding-left:20px;margin:8px 0}
.modal li{margin:6px 0}
.cta-box{background:var(--green-light);border:1px solid #bcdcd7;border-radius:12px;padding:14px 16px;margin-top:14px;font-size:12.5px}
.cta-box b{color:var(--green)}
.paste textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.mobile-tabs{display:none}
@media (max-width:900px){
  .topbar{padding:0 12px;gap:10px;height:56px}
  .crumb,.help span{display:none}
  .brand{flex:1}
  .demo-pill{font-size:10px;padding:3px 6px}
  .demo-pill .long{display:none}
  .brand b{max-width:52vw;font-size:14px}
  .layout{display:block;height:auto}
  .nav{display:none}
  .mobile-tabs{display:flex;gap:4px;background:#f2f6f6;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;z-index:5;overflow-x:auto}
  .mobile-tabs button{border:0;background:none;padding:8px 10px;font-size:12px;border-radius:8px}
  .mobile-tabs button.active{background:#d9ebe8;color:#15524f;font-weight:600}
  .workspace{overflow:visible}
  .ws-head{padding:10px 14px;min-height:0;flex-wrap:wrap}
  .ws-head h1{font-size:16px}
  .body{display:block}
  .list-pane{border-right:0;border-bottom:1px solid var(--line);max-height:300px}
  .detail{overflow:visible}
  .detail-inner{padding:16px 14px 30px}
  .foot-bar{padding:10px 14px}
  .steps{grid-template-columns:1fr 1fr}
  .doc{padding:16px 12px}
  .doc-wrap{padding:0;border:0;background:none}
  .doc table{font-size:11px}
  .doc th,.doc td{padding:6px 3px}
  .doc th{font-size:10.5px;white-space:normal}
  .two,.vgrid{grid-template-columns:1fr}
  .sns-grid{grid-template-columns:1fr}
  .bubble{max-width:100%}
  .ig-card .t{font-size:18px}
}
@media print{
  body *{visibility:hidden}
  #printDoc,#printDoc *{visibility:visible}
  #printDoc{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}
  .modal-bg{position:static;background:none}
}
</style>
</head>

  case "startconf":startConf(ds.case);break;
  case "savedraft":var d=captureCompose(ds.mail);if(!d)break;var src=state.mails.filter(function(x){return x.id===ds.mail})[0];
   if(src.folder==="draft"){src.body=d.body;src.subject=d.subject;src.addr=d.to}else{state.mails.unshift({id:"M"+(++state.seq)+"d",folder:"draft",from:BRAND,addr:d.to,toName:src.from,init:BRAND.charAt(0),date:stamp(NOW,nowHM()),subject:d.subject,body:d.body,attach:d.attach,caseId:src.caseId,tags:[{t:"下書き",k:"amber"}]})}
   state.compose=null;render();toast("下書きに保存しました");break;
  case "send":sendMail(ds.mail);break;
  case "regen":var sp2=state.posts.filter(function(x){return x.id===state.selPost})[0];sp2.v=(sp2.v||0)+1;sp2.text=null;render();break;
  case "schedule":var sp3=state.posts.filter(function(x){return x.id===state.selPost})[0];sp3.when=$("#slot").value;sp3.status="scheduled";sp3.text=postText(JOB(sp3.job),sp3.ch,state.lang,sp3.v);render();toast("予約しました："+sp3.when+"（"+CHN[sp3.ch]+"）");break;
  case "unschedule":var sp4=state.posts.filter(function(x){return x.id===state.selPost})[0];sp4.status="draft";sp4.when="";sp4.text=null;render();break;
  case "postnow":var sp5=state.posts.filter(function(x){return x.id===state.selPost})[0];sp5.status="posted";sp5.when=stamp(NOW,nowHM());sp5.text=postText(JOB(sp5.job),sp5.ch,state.lang,sp5.v);render();toast("配信しました（デモのため、実際には配信していません）");break;
  case "newpost":var free=allCases().filter(function(c){return !state.posts.some(function(s){return s.job===c.id})})[0];if(!free){toast("すべてのプランに投稿があります");break}var nid="P"+(++state.seq)+"n";state.posts.unshift({id:nid,job:free.id,status:"draft",ch:"facebook",when:"",auto:false});state.selPost=nid;render();break;
 }
});
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset.auto){state.auto[t.dataset.auto]=t.checked;save();return}
});
document.addEventListener("input",function(e){
 var t=e.target;if(t.id==="rBody"||t.id==="rTo"||t.id==="rSubj"){state.compose={mail:state.selMail,to:$("#rTo").value,subject:$("#rSubj").value,body:$("#rBody").value,attach:$("#replyBox").dataset.attach||null};save()}
});

/* recover in-flight async states after reload */
Object.keys(state.cases).forEach(function(id){var st=state.cases[id],c=C(id);if(!c)return;
 Object.keys(st.res).forEach(function(i){var r=st.res[i];if(r.st==="asking"){r.log.pop();r.st=r.log.length&&r.log[r.log.length-1].st==="ok"?"ok":"";}});
 if(st.conf&&!st.conf.done){c.svcs.forEach(function(s,i){st.conf.lines[i]="ok"});st.conf.done=true}
 if(st.sent&&!state.mails.some(function(m){return m.caseId===id&&m.kind==="confirm"}))state.mails.unshift({id:"M"+(++state.seq)+"r",folder:"inbox",from:c.from,addr:c.addr,init:c.init,date:stamp(NOW,nowHM()),subject:"Re: "+c.subject,body:c.reply.text,caseId:c.id,kind:"confirm",tags:[{t:"確定",k:"green"},{t:"+"+c.reply.add+"名",k:"amber"}],unread:true});
});
render();
if(!state.seen){state.seen=true;save();help()}
})();
</script>
</body>
</html>
