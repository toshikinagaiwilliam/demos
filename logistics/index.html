<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>引越・物流ワークスペース｜Nova Strategy</title>
<meta name="description" content="引越・輸出・国際宅配の見積依頼メールから、料金表での見積、見積書・作業日程・インボイスの下書き、作業スタッフへの連絡、SNS・LINE配信までをひとつの画面で。タイの引越・物流・通関会社向けの業務デモ。">
<style>
:root{--bg:#f6f8fa;--paper:#fff;--ink:#223731;--muted:#788680;--line:#e4eae7;--green:#16654e;--green-2:#104c3a;--green-light:#eaf5ee;--amber:#926417;--amber-light:#fff5df;--red:#b04438;--red-light:#fbeae6;--blue:#476c9f;--blue-light:#e9f0fb;--nav:176px;
--font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.65 var(--font);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;white-space:nowrap;transition:background .15s}
button:hover:not(:disabled){background:#f0f6f2}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #75baa2;outline-offset:2px}
.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.primary:hover:not(:disabled){background:var(--green-2)}
.small{font-size:11px;padding:5px 9px}
.subtle{border:0;background:transparent}
.muted{color:var(--muted)}.tiny{font-size:11px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.btn-i{display:inline-flex;align-items:center;gap:7px}
/* top */
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:22px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-symbol{width:31px;height:31px;background:var(--green);border-radius:9px;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0}
.brand b{font-size:15px;letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.brand small{display:block;font-size:9px;line-height:1.2;letter-spacing:.16em;color:#6b7c73}
.crumb{font-size:12px;color:#7b8b83;flex:1}
.demo-pill{background:#f8f2df;color:#856e30;font-size:11px;border-radius:6px;padding:4px 8px;white-space:nowrap}
.help{border:0;background:none;display:flex;gap:6px;align-items:center;font-size:12px}
/* layout */
.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:var(--nav) minmax(0,1fr)}
.nav{border-right:1px solid var(--line);padding:22px 12px;background:#f3f6f3;display:flex;flex-direction:column;gap:6px}
.nav-label{font-size:10px;letter-spacing:.12em;color:#859389;padding:0 12px 10px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;padding:11px 12px;background:none;border-radius:8px;font-weight:500;font-size:12.5px;width:100%}
.nav button.active{background:#dcebe1;color:#145c44}
.nav button:hover{background:#e5eee7}
.nav .count:empty{display:none}.nav .count{margin-left:auto;background:#fff9;border-radius:6px;padding:0 6px;font-size:10px}
.nav .count.hot{background:var(--green);color:#fff}
.nav-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.nav .note{font-size:9.5px;color:#829083;padding:12px 12px 0;line-height:1.6}
.workspace{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ws-head{min-height:72px;flex-shrink:0;display:flex;align-items:center;padding:10px 26px;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);gap:16px}
.ws-head h1{font-size:19px;line-height:1.5;margin:0;font-weight:600}
.ws-head p{font-size:11px;color:#7b8981;margin:2px 0 0}
.body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.list-pane{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.list-tools{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:16px;padding-top:4px}
.tabs button{border:0;background:none;padding:6px 0;border-bottom:2px solid transparent;border-radius:0;color:#829087;font-size:11.5px}
.tabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.scroll{overflow:auto;flex:1;min-height:0}
.row{width:100%;display:block;border:0;border-bottom:1px solid #edf0ee;border-radius:0;text-align:left;padding:15px 17px;white-space:normal;background:#fff}
.row.active{background:#eef6f0;box-shadow:3px 0 0 var(--green) inset}
.row:hover{background:#f5f8f5}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.row-top b{font-size:11.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-top time{font-size:10px;color:#8a968f}
.dot{width:7px;height:7px;border-radius:50%;background:#267658;flex-shrink:0}
.row .subj{font-size:12.5px;font-weight:500;line-height:1.6;margin:2px 0}
.row .snip{font-size:11px;color:#8c968f;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.row-foot{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:500;white-space:nowrap;line-height:1.7}
.badge.green{background:#e5f2e9;color:#377355}.badge.amber{background:var(--amber-light);color:var(--amber)}.badge.blue{background:var(--blue-light);color:var(--blue)}.badge.gray{background:#f0f2f1;color:#7e8982}.badge.red{background:var(--red-light);color:#a65a4b}
.list-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.detail{min-width:0;overflow:auto;background:#fff}
.detail-inner{padding:24px 30px 40px;max-width:980px}
.mail-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mail-h h2{font-size:19px;margin:0 0 14px;font-weight:600;line-height:1.5}
.sender{display:flex;gap:11px;align-items:center;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:#efe9da;color:#7a6331;display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.sender b{font-size:12.5px;display:block}.sender span{font-size:11px;color:var(--muted)}
.sender time{margin-left:auto;font-size:11px;color:var(--muted)}
.mail-body{white-space:pre-wrap;font-size:13px;line-height:1.95;border-bottom:1px solid var(--line);padding-bottom:20px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.reply{border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}
.reply-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;background:#fafbfa;flex-wrap:wrap}
.reply-h input{border:0;background:transparent;flex:1;min-width:160px;padding:2px}
.reply textarea{width:100%;border:0;min-height:220px;padding:14px;resize:vertical;line-height:1.8;font-size:12.5px;background:#fff}
.reply-f{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfa;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green);border-radius:6px;padding:3px 9px;font-size:11px}
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .em-i{width:58px;height:58px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;color:var(--green);background:#fff}
.empty h3{color:var(--ink);font-size:16px;font-weight:500;margin:0 0 6px}
/* proposal */
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.p-head h2{margin:0;font-size:18px;font-weight:600}
.p-head .meta{font-size:11px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.step{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#8a978f;border:0;background:none;padding:6px 0;text-align:left;border-radius:0;border-top:3px solid #e5ebe7}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid #cfd8d3;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.step.done{border-color:#9cc9b2;color:#3d6d57}.step.done i{background:#9cc9b2;color:#fff;border-color:#9cc9b2}
.step.cur{border-color:var(--green);color:var(--green);font-weight:600}.step.cur i{background:var(--green);color:#fff;border-color:var(--green)}
.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:10px}
.ptabs button{border:0;background:none;border-radius:0;padding:9px 0;border-bottom:2px solid transparent;color:#7d8a83;font-size:12px}
.ptabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin-top:14px}
.card h3{font-size:13.5px;margin:0 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv th{width:28%}
.miss{color:var(--amber)}
.checklist{background:var(--amber-light);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:12px}
.checklist b{color:var(--amber)}
.checklist ul{margin:4px 0 0;padding-left:20px}
.cands{display:grid;gap:12px;margin-top:12px}
.cand{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.cand.off{opacity:.55}
.photo{border-radius:9px;min-height:96px;position:relative;overflow:hidden;display:grid;place-items:end start;padding:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 2px #0005}
.photo svg{position:absolute;right:8px;top:8px;width:44px;height:44px;opacity:.85}
.cand-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cand-h b{font-size:13.5px}
.cand .spec{font-size:11.5px;color:#5f6d66;margin:2px 0 6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--green-light);color:var(--green)}
.chip.no{background:#f3f3f1;color:#9a8f7a;text-decoration:line-through}
.owner{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bubble{border-radius:10px;padding:8px 11px;font-size:12px;max-width:520px;line-height:1.7}
.bubble.out{background:#e9f6ee}
.bubble.in{background:#f2f3f5}
.bubble .tr{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.vac{font-size:11px;font-weight:600}
.doc{border:1px solid var(--line);border-radius:6px;padding:28px 30px;background:#fff;box-shadow:0 6px 20px #2237310d;max-width:760px}
.doc h4{margin:0;font-size:18px}
.doc .to{font-size:13px;margin:14px 0 4px}
.doc .lead{font-size:12px;color:#5d6b64;margin:0 0 14px}
.doc-prop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding:14px 0}
.doc-prop .photo{min-height:104px}
.route{display:grid;gap:0;margin-top:6px}
.route div{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:8px;font-size:12px;align-items:start}
.route .ln{width:2px;background:#cfe3d7;justify-self:center;height:100%}
.route .pt{width:10px;height:10px;border-radius:50%;background:var(--green);margin:5px auto 0}
.foot-bar{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:12px 30px;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.foot-bar .sum{margin-right:auto;font-size:11.5px;color:var(--muted)}
/* sns */
.sns-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.post-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-width:420px}
.post-prev .ph{display:flex;gap:9px;align-items:center;padding:10px 12px;font-size:12px}
.post-prev .ph .avatar{width:28px;height:28px;font-size:11px;background:var(--green);color:#fff}
.post-prev .photo{border-radius:0;min-height:200px}
.post-prev .tx{white-space:pre-wrap;padding:12px;font-size:12.5px;line-height:1.75}
.line-prev{background:#8cabd9;border-radius:12px;padding:14px;max-width:420px}
.line-prev .lb{background:#fff;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:12.5px;line-height:1.75}
.line-prev .photo{border-radius:12px;margin-bottom:8px;min-height:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:11.5px}
.seg button.on{background:var(--green);color:#fff}
.cal{display:grid;gap:6px}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.cal-day b{font-size:11.5px}
.cal-day .it{font-size:11px;margin-top:4px;display:flex;gap:6px;align-items:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:6px 0}
.toggle input{margin-top:3px;accent-color:var(--green)}
/* misc */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#21352f;color:#fff;border-radius:10px;padding:10px 16px;font-size:12.5px;box-shadow:0 8px 24px #0003;z-index:50;max-width:92vw}
.modal-bg{position:fixed;inset:0;background:#1d2b2680;z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal ol{padding-left:20px;margin:8px 0}
.modal li{margin:6px 0}
.cta-box{background:var(--green-light);border:1px solid #bfdccb;border-radius:12px;padding:14px 16px;margin-top:14px;font-size:12.5px}
.cta-box b{color:var(--green)}
.paste textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.mobile-tabs{display:none}
@media (max-width:900px){
  .topbar{padding:0 12px;gap:10px;height:56px}
  .crumb,.help span{display:none}
  .brand{flex:1}
  .demo-pill{font-size:10px;padding:3px 6px}
  .demo-pill .long{display:none}
  .ws-head{flex-wrap:wrap}
  .brand b{max-width:52vw;font-size:14px}
  .layout{display:block;height:auto}
  .nav{display:none}
  .mobile-tabs{display:flex;gap:4px;background:#f3f6f3;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;z-index:5;overflow-x:auto}
  .mobile-tabs button{border:0;background:none;padding:8px 10px;font-size:12px;border-radius:8px}
  .mobile-tabs button.active{background:#dcebe1;color:#145c44;font-weight:600}
  .workspace{overflow:visible}
  .ws-head{padding:10px 14px;min-height:0}
  .ws-head h1{font-size:16px}
  .body{display:block}
  .list-pane{border-right:0;border-bottom:1px solid var(--line);max-height:300px}
  .detail{overflow:visible}
  .detail-inner{padding:16px 14px 30px}
  .foot-bar{padding:10px 14px}
  .steps{grid-template-columns:1fr}
  .cand{grid-template-columns:1fr}
  .cand .photo{min-height:120px}
  .doc{padding:18px 16px}
  .doc-prop{grid-template-columns:1fr}
  .sns-grid{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden}
  #printDoc,#printDoc *{visibility:visible}
  #printDoc{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}
  .modal-bg{position:static;background:none}
}

</style>

.qty{width:74px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;text-align:right;background:#fff}
.tbl-wrap{overflow-x:auto;max-width:100%}
tr.off td{color:#a9b2ad}

 return tp.hook[lang][v%3]+"\n"+tp.body[lang]+(ch==="line"?"":"\n\n"+tp.tags[lang])+(lang==="ja"?"\n— "+BRAND:lang==="en"?"\n— "+BRAND_EN:"\n— "+BRAND_EN);

function calendar(){
 var out="";
 for(var i=-2;i<7;i++){var d=addD(NOW,i);var key=md(d);
  var its=state.posts.filter(function(s){return s.when&&s.when.split(" ")[0]===key});
  out+='<div class="cal-day"><b>'+mdw(d)+(i===0?"　今日":"")+'</b>'+(its.length?its.map(function(s){return '<div class="it"><span class="badge '+(s.status==="posted"?"gray":"green")+'">'+s.when.split(" ")[1]+'</span>'+esc(TOPICS[s.topic].t)+'</div>'}).join(""):'<div class="it muted">—</div>')+'</div>'}
 return '<div class="cal">'+out+'</div>';
}

/* ============================================================ view: jobs */
function upcoming(){
 var list=BASEJOBS.map(function(j){return {d:new Date(j.d),t:j.t,title:j.title,who:j.who,base:true}});
 (state.jobs||[]).forEach(function(j){var c=C(j.caseId);if(!c)return;c.plan.forEach(function(p){list.push({d:new Date(p[0]),t:p[1],title:(c.custom?"":c.from.split("（")[0]+"："),sub:p[2],caseId:c.id})})});
 var end=addD(NOW,15);
 return list.filter(function(x){return x.d>=addD(NOW,0)&&x.d<end}).sort(function(a,b){return a.d-b.d||String(a.t).localeCompare(String(b.t))});
}

function go(view){state.view=view;render();window.scrollTo(0,0)}
function openCase(id){state.selCase=id;var s=cs(id);state.ptab=s.read?(s.step>=3?"docs":s.step>=2?"quote":"read"):"read";go("quote")}
function captureCompose(mailId){var to=$("#rTo"),sj=$("#rSubj"),b=$("#rBody");if(!to)return null;return {mail:mailId,to:to.value,subject:sj.value,body:b.value,attach:$("#replyBox").dataset.attach||null}}
function attachDoc(caseId){
 var st=cs(caseId),c=C(caseId);if(!st.read)return;st.attached=true;if(st.step<3)st.step=3;
 var mid=state.mails.filter(function(m){return m.caseId===caseId&&m.folder==="inbox"&&m.kind!=="accept"})[0];
 state.compose={mail:mid.id,to:mid.addr,subject:"Re: "+mid.subject,body:quoteMail(c,st),attach:docName(c)};
 state.folder="inbox";state.selMail=mid.id;go("mail");
 setTimeout(function(){var r=$("#replyBox");if(r&&r.scrollIntoView)r.scrollIntoView({behavior:"smooth",block:"start"})},50);
 toast("見積書を添付し、返信の本文を作りました。内容を確認して送信してください");
}
function sendMail(mailId){
 var m=state.mails.filter(function(x){return x.id===mailId})[0],d=captureCompose(mailId);if(!d||!m)return;
 if(!d.to||!d.body.trim()){toast("宛先と本文を入れてください");return}
 var sent={id:"M"+(++state.seq)+"s",folder:"sent",from:BRAND,addr:d.to,toName:m.folder==="inbox"?m.from:m.toName,init:BRAND.charAt(0),date:stamp(NOW,nowHM()),subject:d.subject,body:d.body,attach:d.attach,caseId:m.caseId,tags:[{t:"送信済み",k:"gray"}]};
 state.mails.unshift(sent);state.compose=null;
 if(m.folder==="draft")state.mails=state.mails.filter(function(x){return x.id!==m.id});
 var st=m.caseId?cs(m.caseId):null,c=m.caseId?C(m.caseId):null;
 if(st&&d.attach&&m.kind!=="accept"&&!st.sent){st.sent=true;
  setTimeout(function(){
   st.accepted=true;
   state.mails.unshift({id:"M"+(++state.seq)+"r",folder:"inbox",from:c.from,addr:c.addr,init:c.init,date:stamp(NOW,nowHM()),subject:"Re: "+d.subject.replace(/^Re:\s*/,""),body:c.accept||(c.lang==="en"?"Thank you for the quotation. Please go ahead.":c.lang==="th"?"ขอบคุณค่ะ ตกลงตามใบเสนอราคาค่ะ":"お見積りありがとうございます。この内容でお願いします。"),tr:c.acceptTr||(c.lang==="th"?"（訳）ありがとうございます。見積りの内容でお願いします。":""),caseId:c.id,kind:"accept",tags:[{t:"受注",k:"green"}],unread:true});
   render();toast(c.from+" から返信が届きました（受注）");
  },3500);
 }
 if(st&&m.kind==="accept"&&st.crewMsg&&!st.confirmed){st.confirmed=true;if(!state.jobs.some(function(j){return j.caseId===m.caseId}))state.jobs.push({caseId:m.caseId});
  setTimeout(function(){toast("作業予定に登録しました（「案件・作業予定」で確認できます）")},3300)}
 state.folder="sent";state.selMail=sent.id;render();toast("送信しました（デモのため、実際には送信していません）");
}

 if(!c.crew)c.crew=genericCrew(c);

document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 var ds=t.dataset;
 if(t.hasAttribute("data-close"))return;
 if(ds.view){go(ds.view);return}
 if(ds.caseOpen){openCase(ds.caseOpen);return}
 if(ds.folder){state.folder=ds.folder;var f=state.mails.filter(function(m){return m.folder===ds.folder})[0];state.selMail=f?f.id:null;state.compose=null;render();return}
 if(ds.mail&&!ds.act){state.selMail=ds.mail;state.compose=state.compose&&state.compose.mail===ds.mail?state.compose:null;state.mails.forEach(function(m){if(m.id===ds.mail)m.unread=false});render();return}
 if(ds.case&&!ds.act){state.selCase=ds.case;var s0=cs(ds.case);state.ptab=s0.read?(s0.step>=3?"docs":s0.step>=2?"quote":"read"):"read";render();return}
 if(ds.ptab){var s1=cs(state.selCase);if(ds.ptab!=="mail"&&ds.ptab!=="read"&&!s1.read){toast("先に依頼内容を読み取ってください");return}state.ptab=ds.ptab;if(ds.ptab==="quote"&&s1.step<2)s1.step=2;if(ds.ptab==="docs"&&s1.step<3)s1.step=3;render();return}
 if(ds.post){state.selPost=ds.post;render();return}
 if(ds.ch){var sp=state.posts.filter(function(x){return x.id===state.selPost})[0];sp.ch=ds.ch;sp.text=null;render();return}
 if(ds.lang){state.lang=ds.lang;state.posts.forEach(function(x){if(x.status==="draft")x.text=null});render();return}
 switch(ds.act){
  case "help":help();break;
  case "rates":ratesModal();break;
  case "reset":if(window.confirm("デモを最初の状態に戻しますか？")){state=fresh();render();toast("最初の状態に戻しました")}break;
  case "paste":pasteModal();break;
  case "gomail":var mm=state.mails.filter(function(m){return m.caseId===state.selCase&&m.folder==="inbox"})[0];if(mm){state.folder="inbox";state.selMail=mm.id}go("mail");break;
  case "toquote":openCase(ds.case);break;
  case "extract":var st=cs(ds.case),cc=C(ds.case);t.disabled=true;t.innerHTML=IC.spark+"読み取っています…";setTimeout(function(){st.read=true;st.step=1;st.items=initItems(cc);state.ptab="read";render()},900);break;
  case "viewdoc":var c2=C(ds.case),st3=cs(ds.case);if(!st3.read){toast("先に依頼内容を読み取ってください");break}modal(docsHtml(c2,st3,true)+'<div class="actions" style="justify-content:flex-end"><button data-act="print">印刷・PDFで保存</button><button class="primary" data-close>閉じる</button></div>');break;
  case "print":window.print();break;
  case "attach":attachDoc(ds.case);break;
  case "insertdoc":var mi=state.mails.filter(function(x){return x.id===ds.mail})[0];attachDoc(mi.caseId);break;
  case "savedraft":var d=captureCompose(ds.mail);if(!d)break;var src=state.mails.filter(function(x){return x.id===ds.mail})[0];
   if(src.folder==="draft"){src.body=d.body;src.subject=d.subject;src.addr=d.to}else{state.mails.unshift({id:"M"+(++state.seq)+"d",folder:"draft",from:BRAND,addr:d.to,toName:src.from,init:BRAND.charAt(0),date:stamp(NOW,nowHM()),subject:d.subject,body:d.body,attach:d.attach,caseId:src.caseId,tags:[{t:"下書き",k:"amber"}]})}
   state.compose=null;render();toast("下書きに保存しました");break;
  case "send":sendMail(ds.mail);break;
  case "confirmjob":confirmJob(ds.case,state.selMail);break;
  case "regen":var sp2=state.posts.filter(function(x){return x.id===state.selPost})[0];sp2.v=(sp2.v||0)+1;sp2.text=null;render();break;
  case "schedule":var sp3=state.posts.filter(function(x){return x.id===state.selPost})[0];sp3.when=$("#slot").value;sp3.status="scheduled";sp3.text=postText(sp3,state.lang);render();toast("予約しました："+sp3.when+"（"+CHN[sp3.ch]+"）");break;
  case "unschedule":var sp4=state.posts.filter(function(x){return x.id===state.selPost})[0];sp4.status="draft";sp4.when="";sp4.text=null;render();break;
  case "postnow":var sp5=state.posts.filter(function(x){return x.id===state.selPost})[0];sp5.status="posted";sp5.when=stamp(NOW,nowHM());sp5.text=postText(sp5,state.lang);render();toast("配信しました（デモのため、実際には配信していません）");break;
  case "newpost":var keys=Object.keys(TOPICS),used=state.posts.filter(function(p){return p.status==="draft"}).map(function(p){return p.topic});var tk=keys.filter(function(k){return used.indexOf(k)<0})[0]||keys[state.seq%keys.length];var nid="S"+(++state.seq)+"n";state.posts.unshift({id:nid,topic:tk,status:"draft",ch:"instagram",when:"",auto:false});state.selPost=nid;render();break;
 }
});
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset.on){var st=cs(t.dataset.case);st.items[+t.dataset.on].on=t.checked;render();return}
 if(t.dataset.qty){var st2=cs(t.dataset.case),v=parseFloat(t.value);st2.items[+t.dataset.qty].q=isFinite(v)&&v>=0?Math.round(v*100)/100:0;render();return}
 if(t.dataset.auto){state.auto[t.dataset.auto]=t.checked;save();return}
});
document.addEventListener("input",function(e){
 var t=e.target;if(t.id==="rBody"||t.id==="rTo"||t.id==="rSubj"){state.compose={mail:state.selMail,to:$("#rTo").value,subject:$("#rSubj").value,body:$("#rBody").value,attach:$("#replyBox").dataset.attach||null};save()}
});

render();
if(!state.seen){state.seen=true;save();help()}
})();
</script>
</body>
