<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>候補者推薦ワークスペース｜Nova Strategy</title>
<meta name="description" content="企業からの求人依頼メールから、求人票・候補者の照合と意向確認・推薦書・面接調整、求人のSNS配信までをひとつの画面で。人材紹介会社向けの業務デモ。">
<style>
:root{--bg:#f6f8fa;--paper:#fff;--ink:#223731;--muted:#788680;--line:#e4eae7;--green:#16654e;--green-2:#104c3a;--green-light:#eaf5ee;--amber:#926417;--amber-light:#fff5df;--red:#b04438;--red-light:#fbeae6;--blue:#476c9f;--blue-light:#e9f0fb;--nav:176px;
--font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.65 var(--font);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;white-space:nowrap;transition:background .15s}
button:hover:not(:disabled){background:#f0f6f2}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #75baa2;outline-offset:2px}
.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.primary:hover:not(:disabled){background:var(--green-2)}
.small{font-size:11px;padding:5px 9px}
.subtle{border:0;background:transparent}
.muted{color:var(--muted)}.tiny{font-size:11px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.btn-i{display:inline-flex;align-items:center;gap:7px}
/* top */
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:22px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-symbol{width:31px;height:31px;background:var(--green);border-radius:9px;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0}
.brand b{font-size:15px;letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.brand small{display:block;font-size:9px;line-height:1.2;letter-spacing:.16em;color:#6b7c73}
.crumb{font-size:12px;color:#7b8b83;flex:1}
.demo-pill{background:#f8f2df;color:#856e30;font-size:11px;border-radius:6px;padding:4px 8px;white-space:nowrap}
.help{border:0;background:none;display:flex;gap:6px;align-items:center;font-size:12px}
/* layout */
.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:var(--nav) minmax(0,1fr)}
.nav{border-right:1px solid var(--line);padding:22px 12px;background:#f3f6f3;display:flex;flex-direction:column;gap:6px}
.nav-label{font-size:10px;letter-spacing:.12em;color:#859389;padding:0 12px 10px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;padding:11px 12px;background:none;border-radius:8px;font-weight:500;font-size:12.5px;width:100%}
.nav button.active{background:#dcebe1;color:#145c44}
.nav button:hover{background:#e5eee7}
.nav .count:empty{display:none}.nav .count{margin-left:auto;background:#fff9;border-radius:6px;padding:0 6px;font-size:10px}
.nav .count.hot{background:var(--green);color:#fff}
.nav-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.nav .note{font-size:9.5px;color:#829083;padding:12px 12px 0;line-height:1.6}
.workspace{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ws-head{min-height:72px;flex-shrink:0;display:flex;align-items:center;padding:10px 26px;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);gap:16px}
.ws-head h1{font-size:19px;line-height:1.5;margin:0;font-weight:600}
.ws-head p{font-size:11px;color:#7b8981;margin:2px 0 0}
.body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.list-pane{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.list-tools{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:16px;padding-top:4px}
.tabs button{border:0;background:none;padding:6px 0;border-bottom:2px solid transparent;border-radius:0;color:#829087;font-size:11.5px}
.tabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.scroll{overflow:auto;flex:1;min-height:0}
.row{width:100%;display:block;border:0;border-bottom:1px solid #edf0ee;border-radius:0;text-align:left;padding:15px 17px;white-space:normal;background:#fff}
.row.active{background:#eef6f0;box-shadow:3px 0 0 var(--green) inset}
.row:hover{background:#f5f8f5}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.row-top b{font-size:11.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-top time{font-size:10px;color:#8a968f}
.dot{width:7px;height:7px;border-radius:50%;background:#267658;flex-shrink:0}
.row .subj{font-size:12.5px;font-weight:500;line-height:1.6;margin:2px 0}
.row .snip{font-size:11px;color:#8c968f;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.row-foot{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:500;white-space:nowrap;line-height:1.7}
.badge.green{background:#e5f2e9;color:#377355}.badge.amber{background:var(--amber-light);color:var(--amber)}.badge.blue{background:var(--blue-light);color:var(--blue)}.badge.gray{background:#f0f2f1;color:#7e8982}.badge.red{background:var(--red-light);color:#a65a4b}
.list-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.detail{min-width:0;overflow:auto;background:#fff}
.detail-inner{padding:24px 30px 40px;max-width:980px}
.mail-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mail-h h2{font-size:19px;margin:0 0 14px;font-weight:600;line-height:1.5}
.sender{display:flex;gap:11px;align-items:center;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:#efe9da;color:#7a6331;display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.sender b{font-size:12.5px;display:block}.sender span{font-size:11px;color:var(--muted)}
.sender time{margin-left:auto;font-size:11px;color:var(--muted)}
.mail-body{white-space:pre-wrap;font-size:13px;line-height:1.95;border-bottom:1px solid var(--line);padding-bottom:20px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.reply{border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}
.reply-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;background:#fafbfa;flex-wrap:wrap}
.reply-h input{border:0;background:transparent;flex:1;min-width:160px;padding:2px}
.reply textarea{width:100%;border:0;min-height:220px;padding:14px;resize:vertical;line-height:1.8;font-size:12.5px;background:#fff}
.reply-f{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfa;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green);border-radius:6px;padding:3px 9px;font-size:11px}
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .em-i{width:58px;height:58px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;color:var(--green);background:#fff}
.empty h3{color:var(--ink);font-size:16px;font-weight:500;margin:0 0 6px}
/* proposal */
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.p-head h2{margin:0;font-size:18px;font-weight:600}
.p-head .meta{font-size:11px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.step{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#8a978f;border:0;background:none;padding:6px 0;text-align:left;border-radius:0;border-top:3px solid #e5ebe7}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid #cfd8d3;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.step.done{border-color:#9cc9b2;color:#3d6d57}.step.done i{background:#9cc9b2;color:#fff;border-color:#9cc9b2}
.step.cur{border-color:var(--green);color:var(--green);font-weight:600}.step.cur i{background:var(--green);color:#fff;border-color:var(--green)}
.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:10px}
.ptabs button{border:0;background:none;border-radius:0;padding:9px 0;border-bottom:2px solid transparent;color:#7d8a83;font-size:12px}
.ptabs button.active{color:var(--green);border-color:var(--green);font-weight:600}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin-top:14px}
.card h3{font-size:13.5px;margin:0 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv th{width:28%}
.miss{color:var(--amber)}
.checklist{background:var(--amber-light);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:12px}
.checklist b{color:var(--amber)}
.checklist ul{margin:4px 0 0;padding-left:20px}
.cands{display:grid;gap:12px;margin-top:12px}
.cand{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.cand.off{opacity:.55}
.photo{border-radius:9px;min-height:96px;position:relative;overflow:hidden;display:grid;place-items:end start;padding:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 2px #0005}
.photo svg{position:absolute;right:8px;top:8px;width:44px;height:44px;opacity:.85}
.cand-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cand-h b{font-size:13.5px}
.cand .spec{font-size:11.5px;color:#5f6d66;margin:2px 0 6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--green-light);color:var(--green)}
.chip.no{background:#f3f3f1;color:#9a8f7a;text-decoration:line-through}
.owner{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bubble{border-radius:10px;padding:8px 11px;font-size:12px;max-width:520px;line-height:1.7}
.bubble.out{background:#e9f6ee}
.bubble.in{background:#f2f3f5}
.bubble .tr{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.vac{font-size:11px;font-weight:600}
.doc{border:1px solid var(--line);border-radius:6px;padding:28px 30px;background:#fff;box-shadow:0 6px 20px #2237310d;max-width:760px}
.doc h4{margin:0;font-size:18px}
.doc .to{font-size:13px;margin:14px 0 4px}
.doc .lead{font-size:12px;color:#5d6b64;margin:0 0 14px}
.doc-prop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding:14px 0}
.doc-prop .photo{min-height:104px}
.route{display:grid;gap:0;margin-top:6px}
.route div{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:8px;font-size:12px;align-items:start}
.route .ln{width:2px;background:#cfe3d7;justify-self:center;height:100%}
.route .pt{width:10px;height:10px;border-radius:50%;background:var(--green);margin:5px auto 0}
.foot-bar{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:12px 30px;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.foot-bar .sum{margin-right:auto;font-size:11.5px;color:var(--muted)}
/* sns */
.sns-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.post-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-width:420px}
.post-prev .ph{display:flex;gap:9px;align-items:center;padding:10px 12px;font-size:12px}
.post-prev .ph .avatar{width:28px;height:28px;font-size:11px;background:var(--green);color:#fff}
.post-prev .photo{border-radius:0;min-height:200px}
.post-prev .tx{white-space:pre-wrap;padding:12px;font-size:12.5px;line-height:1.75}
.line-prev{background:#8cabd9;border-radius:12px;padding:14px;max-width:420px}
.line-prev .lb{background:#fff;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:12.5px;line-height:1.75}
.line-prev .photo{border-radius:12px;margin-bottom:8px;min-height:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:11.5px}
.seg button.on{background:var(--green);color:#fff}
.cal{display:grid;gap:6px}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.cal-day b{font-size:11.5px}
.cal-day .it{font-size:11px;margin-top:4px;display:flex;gap:6px;align-items:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:6px 0}
.toggle input{margin-top:3px;accent-color:var(--green)}
/* misc */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#21352f;color:#fff;border-radius:10px;padding:10px 16px;font-size:12.5px;box-shadow:0 8px 24px #0003;z-index:50;max-width:92vw}
.modal-bg{position:fixed;inset:0;background:#1d2b2680;z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal ol{padding-left:20px;margin:8px 0}
.modal li{margin:6px 0}
.cta-box{background:var(--green-light);border:1px solid #bfdccb;border-radius:12px;padding:14px 16px;margin-top:14px;font-size:12.5px}
.cta-box b{color:var(--green)}
.paste textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.mobile-tabs{display:none}
@media (max-width:900px){
  .topbar{padding:0 12px;gap:10px;height:56px}
  .crumb,.help span{display:none}
  .brand{flex:1}
  .demo-pill{font-size:10px;padding:3px 6px}
  .demo-pill .long{display:none}
  .ws-head{flex-wrap:wrap}
  .brand b{max-width:52vw;font-size:14px}
  .layout{display:block;height:auto}
  .nav{display:none}
  .mobile-tabs{display:flex;gap:4px;background:#f3f6f3;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;z-index:5;overflow-x:auto}
  .mobile-tabs button{border:0;background:none;padding:8px 10px;font-size:12px;border-radius:8px}
  .mobile-tabs button.active{background:#dcebe1;color:#145c44;font-weight:600}
  .workspace{overflow:visible}
  .ws-head{padding:10px 14px;min-height:0}
  .ws-head h1{font-size:16px}
  .body{display:block}
  .list-pane{border-right:0;border-bottom:1px solid var(--line);max-height:300px}
  .detail{overflow:visible}
  .detail-inner{padding:16px 14px 30px}
  .foot-bar{padding:10px 14px}
  .steps{grid-template-columns:1fr}
  .cand{grid-template-columns:1fr}
  .cand .photo{min-height:120px}
  .doc{padding:18px 16px}
  .doc-prop{grid-template-columns:1fr}
  .sns-grid{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden}
  #printDoc,#printDoc *{visibility:visible}
  #printDoc{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}
  .modal-bg{position:static;background:none}
}

</style>
<style>
:root{--green:#2f5d8a;--green-2:#244a6e;--green-light:#ebf2f9}
.nav button.active,.mobile-tabs button.active{background:#dde8f3;color:#244a6e}
.nav{background:#f3f5f8}.nav button:hover{background:#e6edf4}
.row.active{background:#eef3f9}
.badge.green{background:#e3eef8;color:#2f5d8a}
.bubble.out{background:#e7f0f9}
button:hover:not(:disabled){background:#f0f4f9}
.route .ln{background:#cfdcea}
.cand{grid-template-columns:96px minmax(0,1fr)}
.photo svg{width:40px;height:40px}
.cand .photo{align-self:start;min-height:110px}
.step.done{border-color:#a9c3dd;color:#3d5f80}.step.done i{background:#a9c3dd;border-color:#a9c3dd}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ============================================================ helpers */
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n).toLocaleString("en-US")}
var IC={
 mail:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
 user:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
 share:'<svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
 list:'<svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 reset:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
 help:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>',
 spark:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
 send:'<svg class="icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>',
 clip:'<svg class="icon" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>',
 doc:'<svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>',
 plus:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 cal:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
 chat:'<svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
 person:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>'
};

/* ============================================================ personalization */
var q=new URLSearchParams(location.search);
var COMPANY=(q.get("c")||"").slice(0,60).trim();
var SERVICES=(q.get("s")||"").split(/[,、]/).map(function(x){return x.trim().slice(0,20)}).filter(Boolean).slice(0,4);
var BRAND=COMPANY||"サンプル人材サービス";
var STAFF="山本",STAFF_EN="Yamamoto";

/* ============================================================ dates */
var NOW=new Date();

function score(k,c){
 var s=0,hit=[],miss=[];
 if(c.nat&&k.nat!==c.nat)return null;
 if(c.area){if(k.areas.indexOf(c.area)<0)return null;s+=20;hit.push(c.area+"で勤務可")}
 if(c.field.length){var f=k.field.filter(function(x){return c.field.indexOf(x)>=0});if(!f.length)return null;s+=15+f.length*8;f.forEach(function(x){hit.push(x+"経験")})}
 if(c.jlpt){if(JL[k.jlpt]<JL[c.jlpt])return null;s+=10;hit.push("日本語"+k.jlpt);if(JL[k.jlpt]>JL[c.jlpt])s+=4}
 if(c.en){if(ENL[k.en]<ENL[c.en])return null;s+=10;hit.push("英語"+k.en)}
 if(c.budget){if(k.want<=c.budget){s+=20}else if(k.want<=c.budget*1.08){s+=4;miss.push("希望給与が予算を少し超過")}else return null}
 if(c.yrs){if(k.yrs>=c.yrs){s+=10+Math.min(6,k.yrs-c.yrs)}else miss.push("経験"+k.yrs+"年（希望"+c.yrs+"年）")}
 return {k:k,s:s,hit:hit,miss:miss};
}
function candidates(c){return CANDS.map(function(k){return score(k,c)}).filter(Boolean).sort(function(a,b){return b.s-a.s||a.k.want-b.k.want})}

 c.pos=c.field.length?c.field.join("・")+"スタッフ":(en?"Staff":"スタッフ");c.posEn=c.field.map(function(f){return FIELD_EN[f]}).join(" / ")||"Staff";c.posTh="พนักงาน";

function allCases(){return CASES.concat(Object.keys(state.custom).map(function(k){return state.custom[k]}))}
function counts(){
 var inbox=state.mails.filter(function(m){return m.folder==="inbox"&&m.unread}).length;
 var open=allCases().filter(function(c){return !cs(c.id).sent}).length;
 var drafts=state.posts.filter(function(p){return p.status==="draft"}).length;
 return {inbox:inbox,open:open,drafts:drafts};
}
var VIEWS={mail:{t:"メール",d:"企業からの求人依頼の受信から、推薦書を添えた返信まで。",i:IC.mail},proposal:{t:"候補者推薦",d:"求人票づくり、候補者リストとの照合・意向確認、推薦書と面接日程まで。",i:IC.user},sns:{t:"求人のSNS・LINE配信",d:"求人票から募集投稿を日本語・タイ語・英語で作り、決まった時間に自動で配信。",i:IC.share}};
function render(){
 var n=counts(),v=VIEWS[state.view];
 var nav='<button data-view="mail" class="'+(state.view==="mail"?"active":"")+'">'+IC.mail+'メール<span class="count '+(n.inbox?"hot":"")+'">'+(n.inbox||"")+'</span></button>'+
  '<button data-view="proposal" class="'+(state.view==="proposal"?"active":"")+'">'+IC.user+'候補者推薦<span class="count">'+(n.open||"")+'</span></button>'+
  '<button data-view="sns" class="'+(state.view==="sns"?"active":"")+'">'+IC.share+'求人のSNS配信<span class="count">'+(n.drafts||"")+'</span></button>';
 var html='<header class="topbar"><div class="brand"><div class="brand-symbol">'+esc(BRAND.charAt(0))+'</div><div><b>'+esc(BRAND)+'</b><small>RECRUITMENT WORKSPACE</small></div></div>'+
  '<div class="crumb">ワークスペース　/　'+v.t+'</div><span class="demo-pill">DEMO<span class="long"> · 実際には送信しません</span></span>'+
  '<button class="help" data-act="help">'+IC.help+'<span>使い方</span></button></header>'+
  '<div class="layout"><nav class="nav"><div class="nav-label">WORKSPACE</div>'+nav+
  '<div class="nav-bottom"><button data-act="cands">'+IC.list+'候補者リスト</button><button data-act="reset">'+IC.reset+'デモをリセット</button>'+
  '<div class="note">● このブラウザに自動保存<br>企業・候補者はすべて架空のサンプルです</div></div></nav>'+
  '<main class="workspace"><div class="mobile-tabs">'+nav+'<button data-act="help">使い方</button></div>'+
  '<div class="ws-head"><div><h1>'+v.t+'</h1><p>'+v.d+'</p></div><div class="head-actions">'+headActions()+'</div></div>'+
  (state.view==="mail"?viewMail():state.view==="proposal"?viewProposal():viewSns())+'</main></div>';
 $("#app").innerHTML=html;
 save();
}
function headActions(){
 if(state.view==="mail")return '<button class="btn-i" data-act="paste">'+IC.plus+'求人依頼を貼り付けて試す</button>';
 if(state.view==="proposal")return '<button class="btn-i" data-act="gomail">'+IC.mail+'関連メール</button>';
 return '<button class="btn-i" data-act="newpost">'+IC.plus+'求人から投稿を作る</button>';
}

/* ============================================================ view: mail */
function viewMail(){
 var f=state.folder,list=state.mails.filter(function(m){return m.folder===f});
 var rows=list.map(function(m){
  return '<button class="row '+(m.id===state.selMail?"active":"")+'" data-mail="'+m.id+'"><div class="row-top">'+(m.unread?'<span class="dot"></span>':'')+'<b>'+esc(f==="inbox"?m.from:"宛先："+(m.toName||m.addr))+'</b><time>'+esc(m.date)+'</time></div><div class="subj">'+esc(m.subject)+'</div><div class="snip">'+esc(m.body.slice(0,90))+'</div><div class="row-foot">'+(m.tags||[]).map(function(t){return '<span class="badge '+t.k+'">'+esc(t.t)+'</span>'}).join("")+(m.attach?'<span class="badge green">'+IC.clip.replace('class="icon"','class="icon" style="width:11px;height:11px"')+'添付あり</span>':'')+'</div></button>';
 }).join("")||'<div class="empty"><div><p class="tiny">'+(f==="sent"?"送信済みのメールはまだありません":f==="draft"?"下書きはありません":"受信メールはありません")+'</p></div></div>';
 var tabs=[["inbox","受信箱"],["sent","送信済み"],["draft","下書き"]].map(function(t){var c=state.mails.filter(function(m){return m.folder===t[0]}).length;return '<button data-folder="'+t[0]+'" class="'+(f===t[0]?"active":"")+'">'+t[1]+(c?" "+c:"")+'</button>'}).join("");
 var sel=state.mails.filter(function(m){return m.id===state.selMail&&m.folder===f})[0]||list[0];
 return '<div class="body"><section class="list-pane"><div class="list-tools"><div class="tabs">'+tabs+'</div></div><div class="scroll">'+rows+'</div><div class="list-foot">サンプルメール / 外部のメールとは接続していません</div></section>'+
  '<section class="detail">'+(sel?mailDetail(sel):'<div class="empty"><div><div class="em-i">'+IC.mail+'</div><h3>メールを選んでください</h3></div></div>')+'</section></div>';
}
function mailDetail(m){
 if(m.unread){m.unread=false;setTimeout(save,0)}
 var h='<div class="detail-inner"><div class="mail-h"><h2>'+esc(m.subject)+'</h2><div>'+(m.tags||[]).map(function(t){return '<span class="badge '+t.k+'">'+esc(t.t)+'</span>'}).join(" ")+'</div></div>'+
  '<div class="sender"><div class="avatar">'+esc(m.init||"?")+'</div><div><b>'+esc(m.folder==="inbox"?m.from:BRAND+" "+STAFF)+'</b><span>'+esc(m.folder==="inbox"?m.addr:"宛先："+m.addr)+'</span></div><time>'+esc(m.date)+'</time></div>'+
  '<div class="mail-body">'+esc(m.body)+'</div>';
 if(m.attach)h+='<div class="actions"><span class="attach">'+IC.doc+esc(m.attach)+'</span><button class="small" data-act="viewdoc" data-case="'+m.caseId+'">開く</button></div>';
 if(m.folder==="inbox"&&m.caseId){
  var st=cs(m.caseId);
  if(m.kind==="interview"){
   var v=st.interview;
   h+='<div class="actions"><button class="primary btn-i" data-act="confirmint" data-case="'+m.caseId+'" '+(v&&v.confirmed?"disabled":"")+'>'+IC.cal+(v&&v.confirmed?"面接予定に登録済み":"面接を確定して返信を作る")+'</button><span class="tiny muted">返信から面接したい候補者と日時を読み取り、確認メールと候補者への案内を作ります</span></div>';
  }else{
   h+='<div class="actions"><button class="primary btn-i" data-act="toproposal" data-case="'+m.caseId+'">'+IC.user+(st.extracted?"候補者推薦の続きを開く":"このメールから候補者推薦を作る")+'</button><span class="tiny muted">'+(st.sent?"推薦書を送信済みです":"求人票づくり → 候補者と照合 → 意向確認 → 推薦書")+'</span></div>';
  }
  h+=replyBox(m);
 }
 if(m.folder==="draft")h+=replyBox(m,true);
 h+='</div>';
 return h;
}
function replyBox(m,isDraft){
 var st=m.caseId?cs(m.caseId):null,c=m.caseId?C(m.caseId):null;
 var d=state.compose&&state.compose.mail===m.id?state.compose:null;
 if(!d){
  var body="",att=null,subj="Re: "+m.subject;
  if(isDraft){body=m.body;att=m.attach;subj=m.subject}
  else if(st&&st.attached&&!st.sent&&m.kind!=="interview"){body=proposalMail(c,st);att=docName(c)}
  d={mail:m.id,to:m.addr,subject:subj,body:body,attach:att};
 }
 var canInsert=st&&st.step>=3&&!st.sent&&m.kind!=="interview";
 return '<div class="reply" id="replyBox" data-attach="'+esc(d.attach||"")+'"><div class="reply-h">↩ 宛先 <input id="rTo" value="'+esc(d.to)+'" aria-label="宛先"><button class="small btn-i" data-act="insertdoc" data-mail="'+m.id+'" '+(canInsert?"":"disabled")+' title="候補者推薦で作った推薦書を添付し、本文を作ります">'+IC.clip+(st&&st.attached?"推薦書を添付済み":"作成中の推薦書を挿入")+'</button></div>'+
  '<div class="reply-h" style="background:#fff">件名 <input id="rSubj" value="'+esc(d.subject)+'" aria-label="件名"></div>'+
  '<textarea id="rBody" placeholder="'+(st&&!st.attached&&m.kind!=="interview"?"「候補者推薦」で推薦書を作ると、ここに返信の本文が入ります":"本文")+'">'+esc(d.body)+'</textarea>'+
  '<div class="reply-f">'+(d.attach?'<span class="attach">'+IC.doc+esc(d.attach)+'</span>':'<span class="tiny muted">添付なし</span>')+'<span style="flex:1"></span><button data-act="savedraft" data-mail="'+m.id+'">下書き保存</button><button class="primary btn-i" data-act="send" data-mail="'+m.id+'">'+IC.send+'送信（デモ）</button></div></div>';
}
function docName(c){return c.cond.lang==="en"?"Candidate_Recommendation_"+c.cond.posEn.replace(/[^A-Za-z]+/g,"_")+".pdf":"候補者のご推薦_"+c.cond.pos.replace(/[\s（）()]/g,"")+".pdf"}

/* ============================================================ view: proposal */
function viewProposal(){
 var list=allCases();
 var rows=list.map(function(c,i){var st=cs(c.id);var lab=st.sent?(st.interview&&st.interview.confirmed?["面接確定","green"]:["推薦済み","green"]):st.step>=1?["対応中","amber"]:["未着手","gray"];
  var k=c.cond;
  return '<button class="row '+(c.id===state.selCase?"active":"")+'" data-case="'+c.id+'"><div class="row-top"><b>'+esc(k.client)+'</b><span class="badge '+lab[1]+'">'+lab[0]+'</span></div><div class="subj">'+esc(k.pos)+'</div><div class="snip">'+esc((k.area||"勤務地未定")+" / "+(k.nat==="jp"?"日本人":k.nat==="th"?"タイ人":"国籍未定")+(k.jlpt?" / 日本語"+k.jlpt+"以上":"")+(k.en?" / 英語"+k.en:"")+" / "+(k.budget?fmt(k.budget)+"B以内":"給与未定"))+'</div><div class="row-foot"><span class="badge gray">'+(c.custom?"貼り付けた求人依頼":"事例"+(i+1)+" · "+esc(c.tag))+'</span></div></button>'}).join("");
 var c=C(state.selCase)||list[0];
 return '<div class="body"><section class="list-pane"><div class="list-tools" style="padding-bottom:10px"><b style="font-size:12px">求人依頼を選択</b> <span class="badge gray">'+list.length+'件</span></div><div class="scroll">'+rows+'</div><div class="list-foot">読み取りは4事例を使ったデモ再現です（貼り付けた求人依頼は簡易読み取り）</div></section>'+
  '<section class="detail">'+caseDetail(c)+'</section></div>';
}
function caseDetail(c){
 var st=cs(c.id);
 var stepLab=["求人票をつくる","候補者の照合・意向確認","推薦書と面接日程"];
 var steps=stepLab.map(function(s,i){var cl=st.step>i+1||(i===2&&st.attached)?"done":(st.step===i+1||(st.step===0&&i===0))?"cur":"";return '<button class="step '+cl+'" data-ptab="'+["cond","cand","doc"][i]+'"><i>'+(i+1)+'</i>'+s+'</button>'}).join("");
 var tabs=[["cond","求人票"],["cand","候補者・意向確認"],["doc","推薦書・面接日程"],["mail","元のメール"]].map(function(t){return '<button data-ptab="'+t[0]+'" class="'+(state.ptab===t[0]?"active":"")+'">'+t[1]+'</button>'}).join("");
 var h='<div class="detail-inner"><div class="p-head"><div><h2>'+esc(c.cond.pos)+'</h2><div class="meta">JOB-'+c.id+' · '+esc(c.cond.client)+' · 担当 '+STAFF+'</div></div><span class="badge '+(st.sent?"green":"amber")+'">'+(st.sent?"推薦書を送信済み":"対応中")+'</span></div>'+
  '<div class="steps">'+steps+'</div><div class="ptabs">'+tabs+'</div>';
 if(state.ptab==="mail")h+='<div class="card"><div class="mail-body" style="border:0;padding:0">'+esc(C(c.id).body)+'</div></div>';
 else if(!st.extracted)h+='<div class="empty"><div><div class="em-i">'+IC.spark+'</div><h3>メールから求人票をつくります</h3><p class="tiny">職種・勤務地・国籍・語学・経験・給与・入社日を取り出して求人票にし、<br>足りない情報は「確認したいこと」にまとめます。英語版・タイ語版も同時に作ります。</p><button class="primary btn-i" data-act="extract" data-case="'+c.id+'">'+IC.spark+'求人票をつくる</button></div></div>';
 else if(state.ptab==="cond")h+=condTab(c,st);
 else if(state.ptab==="cand")h+=candTab(c,st);
 else h+=docTab(c,st);
 h+='</div>';
 var ok=okIds(st);
 h+='<div class="foot-bar"><span class="sum">'+(st.extracted?"候補 "+st.picked.length+"名 ／ 応募意思あり "+ok.length+"名"+(ok.length?" ／ 希望給与 "+fmt(Math.min.apply(null,ok.map(function(id){return K(id).want})))+"〜"+fmt(Math.max.apply(null,ok.map(function(id){return K(id).want})))+" B":""):"求人票をつくってください")+'</span>'+
  '<button class="btn-i" data-act="viewdoc" data-case="'+c.id+'" '+(ok.length?"":"disabled")+'>'+IC.doc+'推薦書プレビュー</button>'+
  '<button class="primary btn-i" data-act="attach" data-case="'+c.id+'" '+(ok.length&&!st.sent?"":"disabled")+'>'+IC.send+(st.sent?"送信済み":"返信へ添付")+'</button></div>';
 return h;
}
function okIds(st){return st.picked.filter(function(id){return st.checks[id]==="yes"})}
function condTab(c,st){
 var k=c.cond;
 var rows=[["企業",k.client],["職種",k.pos],["勤務地",k.area],["国籍",k.nat==="jp"?"日本人":k.nat==="th"?"タイ人":""],["日本語",k.jlpt?k.jlpt+"以上":(k.nat==="jp"?"（ネイティブ）":"不問")],["英語",k.en||"不問"],["経験",k.yrs?k.yrs+"年以上":""],["給与（月額）",k.budget?fmt(k.budget)+" バーツまで":""],["入社",k.start],["仕事内容",(k.duties||[]).join("／")],["待遇・その他",k.perks]];
 var h='<div class="card"><h3>求人票（日本語）</h3><table class="kv">'+rows.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+(r[1]?esc(r[1]):'<span class="miss">記載なし</span>')+'</td></tr>'}).join("")+'</table>'+
  '<div class="checklist"><b>確認したいこと（推薦メールで質問します）</b><ul>'+c.checks.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div></div>'+
  '<div class="card"><h3>英語版・タイ語版（求人サイト・SNS用に自動作成）</h3><table class="kv"><tr><th>English</th><td><b>'+esc(k.posEn)+'</b> — '+esc(AREAS[k.area]?AREAS[k.area].en:"Thailand")+(k.budget?" · up to THB "+fmt(k.budget):"")+(k.jlpt?" · Japanese "+k.jlpt+"+":"")+(k.en?" · English: "+ENL_EN[k.en]:"")+'</td></tr><tr><th>ภาษาไทย</th><td><b>'+esc(k.posTh)+'</b> — '+esc(AREAS[k.area]?AREAS[k.area].th:"ประเทศไทย")+(k.budget?" · เงินเดือนสูงสุด "+fmt(k.budget)+" บาท":"")+(k.jlpt?" · ภาษาญี่ปุ่น "+k.jlpt+" ขึ้นไป":"")+'</td></tr></table>'+
  (state.auto.draft?'<p class="tiny muted" style="margin:8px 0 0">● この求人の募集投稿を「求人のSNS配信」に下書きしました</p>':'')+'</div>'+
  '<div class="actions"><button class="primary btn-i" data-ptab="cand">'+IC.user+'候補者リストと照合する</button><span class="tiny muted">候補者リスト（'+CANDS.length+'名）から条件に合う人を選びます</span></div>';
 return h;
}
function contactMsg(k,c){
 var p=k.g==="f"?"ค่ะ":"ครับ",me="ครับ";
 if(k.nat==="jp")return {txt:k.ja.split(" ")[0]+"様\nお世話になっております。"+BRAND+"の"+STAFF+"です。\n"+c.cond.area+"の「"+c.cond.pos+"」（月給"+fmt(c.cond.budget||0)+"バーツまで）のご紹介です。ご経験に合うと思い、ご連絡しました。推薦を進めてもよろしいでしょうか。",tr:""};
 return {txt:"สวัสดี"+me+" คุณ"+k.name.split(" ")[0]+" มีตำแหน่ง "+c.cond.posTh+" ที่บริษัทญี่ปุ่นใน"+(AREAS[c.cond.area]?AREAS[c.cond.area].th:"")+" เงินเดือนสูงสุด "+fmt(c.cond.budget||0)+" บาท สนใจให้เราแนะนำไหม"+me,
  tr:"（訳）"+k.ja+"さん、"+c.cond.area+"の日系企業で「"+c.cond.pos+"」の求人があります。月給"+fmt(c.cond.budget||0)+"バーツまでです。推薦を進めてもよいですか。"};
}
function contactReply(k){
 var p=k.g==="f"?"ค่ะ":"ครับ";
 if(k.nat==="jp")return k.resp==="no"?{txt:"ご連絡ありがとうございます。申し訳ありません、先週ほかの会社の内定を承諾しました。",tr:""}:{txt:"ありがとうございます。ぜひ進めてください。平日の午後ならオンライン面接が可能です。",tr:""};
 return k.resp==="no"?{txt:"ขอบคุณ"+p+" แต่ตอนนี้ตัดสินใจรับข้อเสนอของที่อื่นไปแล้ว"+p,tr:"（訳）ありがとうございます。ただ、先日ほかの会社の内定を承諾しました。"}:{txt:"สนใจ"+p+" ช่วยแนะนำด้วยนะ"+p+" สัมภาษณ์ได้วันธรรมดาช่วงบ่าย"+p,tr:"（訳）興味があります。ぜひ推薦してください。平日の午後なら面接できます。"};
}
function candTab(c,st){
 var list=candidates(c.cond);
 if(!list.length)return '<div class="card"><h3>条件に合う候補者がいません</h3><p class="tiny muted">推薦メールでは、給与か経験年数の条件を少し広げるご提案をします。あわせて求人の募集投稿で新しい候補者を集めます。</p></div>';
 var ok=okIds(st).length;
 var h='<div class="card" style="padding:12px 16px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:13px">候補者リストから '+list.length+' 名が条件に合いました</b><span class="tiny muted">上位の方にLINEで応募の意思を確認します（タイ人の方はタイ語で）</span><span style="flex:1"></span><button class="small btn-i" data-act="askall" data-case="'+c.id+'">'+IC.chat+'選んだ候補者にまとめて確認</button></div></div><div class="cands">';
 list.forEach(function(r){
  var k=r.k,on=st.picked.indexOf(k.id)>=0,ck=st.checks[k.id]||"none";
  var stat=ck==="yes"?'<span class="vac" style="color:var(--green)">● 応募意思あり</span>':ck==="no"?'<span class="vac" style="color:var(--red)">● 辞退（他社に決定）</span>':ck==="asking"?'<span class="vac" style="color:var(--amber)">● 確認中…</span>':'<span class="vac muted">○ 未確認</span>';
  h+='<div class="cand '+(ck==="no"?"off":"")+'">'+face(k,natJ(k)+" · "+k.age+"歳")+'<div><div class="cand-h"><b>'+esc(k.ja)+'</b><span class="tiny muted">'+esc(k.field.join("・"))+' · 経験'+k.yrs+'年</span><span style="flex:1"></span>'+stat+'</div>'+
   '<div class="spec">'+(k.jlpt?"日本語"+k.jlpt+" · ":"")+(k.en?"英語"+k.en+" · ":"")+'勤務可：'+esc(k.areas.join("・"))+' · 入社：'+esc(k.start)+' · <b style="color:var(--ink)">希望 '+fmt(k.want)+' B/月</b> · 一致度 '+Math.min(99,r.s)+'</div>'+
   '<div class="chips">'+r.hit.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("")+r.miss.map(function(x){return '<span class="chip no">'+esc(x)+'</span>'}).join("")+'</div>'+
   '<div class="owner"><label class="tiny" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-pick="'+k.id+'" data-case="'+c.id+'" '+(on?"checked":"")+' '+(ck==="no"?"disabled":"")+'>推薦に入れる</label>'+
   (ck==="none"?'<button class="small btn-i" data-act="ask" data-cand="'+k.id+'" data-case="'+c.id+'">'+IC.chat+'応募意思を確認（LINE'+(k.nat==="th"?"・タイ語":"")+'）</button>':'')+'</div>';
  if(ck!=="none"){var o=contactMsg(k,c);h+='<div class="owner" style="flex-direction:column"><div class="bubble out" style="white-space:pre-wrap">'+esc(o.txt)+(o.tr?'<span class="tr">'+esc(o.tr)+'</span>':'')+'</div>';
   if(ck!=="asking"){var rp=contactReply(k);h+='<div class="bubble in">'+esc(rp.txt)+(rp.tr?'<span class="tr">'+esc(rp.tr)+'</span>':'')+'</div>'}
   h+='</div>'}

 '<div class="cta-box"><b>このデモを、'+esc(BRAND)+'様の実際の候補者リストとメールで動かします。</b><br>Excel・スプレッドシートの候補者リスト、Gmail・Outlook、LINE公式アカウントと連携できます。<br>開発費 0円 ／ 1機能 月額 5,000バーツ（税別）。まずは30分、お困りの業務をお聞かせください。<br><a href="mailto:toshiki_nagai@william-ac.com?subject=%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B9%E3%83%9A%E3%83%BC%E3%82%B9%E3%81%AE%E3%83%87%E3%83%A2%E3%82%92%E8%A6%8B%E3%81%BE%E3%81%97%E3%81%9F">toshiki_nagai@william-ac.com</a>（Nova Strategy Inc. 永井）</div>'+
 '<div class="actions" style="justify-content:flex-end"><button class="primary" data-close>はじめる</button></div>');
}
function candsModal(){
 modal('<h3>候補者リスト（サンプル '+CANDS.length+'名）</h3><p class="tiny muted">本番では、貴社のExcel・スプレッドシート・データベースの候補者リストをそのまま使います。</p><div style="overflow-x:auto"><table><tr><th>候補者</th><th>国籍</th><th>職種</th><th class="num">経験</th><th>日本語</th><th>英語</th><th class="num">希望給与（B）</th><th>勤務可</th></tr>'+CANDS.map(function(k){return '<tr><td>'+esc(k.ja)+'</td><td>'+natJ(k)+'</td><td class="tiny">'+esc(k.field.join("・"))+'</td><td class="num">'+k.yrs+'年</td><td>'+(k.jlpt||"—")+'</td><td>'+(k.en||"—")+'</td><td class="num">'+fmt(k.want)+'</td><td class="tiny">'+esc(k.areas.join("・"))+'</td></tr>'}).join("")+'</table></div><div class="actions" style="justify-content:flex-end"><button data-close>閉じる</button></div>');
}
function pasteModal(){
 var bg=modal('<h3>求人依頼を貼り付けて試す</h3><p class="tiny muted">実際に届くメール・LINEに近い文面を貼り付けると、受信箱に追加して候補者推薦まで試せます（簡易読み取り）。</p><div class="paste"><textarea id="pasteText" placeholder="例）チョンブリの工場で、日本語N2以上のタイ人通訳を1名探しています。経験2年以上、給与は3.5万バーツまで。"></textarea></div><div class="actions" style="justify-content:flex-end"><button data-close>キャンセル</button><button class="primary" id="pasteGo">受信箱に追加</button></div>');
 $("#pasteGo",bg).onclick=function(){var t=$("#pasteText",bg).value.trim();if(!t)return;
  var r=parse(t),id="X"+(++state.seq);
  state.custom[id]={id:id,custom:true,from:r.cond.client,addr:"client@example.com",init:r.cond.client.charAt(0),date:stamp(NOW,new Date().toTimeString().slice(0,5)),subject:t.split("\n")[0].slice(0,40),tag:"貼り付け",body:t,cond:r.cond,checks:r.checks,addressee:r.addressee};
  state.mails.unshift({id:"M"+id,folder:"inbox",from:r.cond.client,addr:"client@example.com",init:r.cond.client.charAt(0),date:state.custom[id].date,subject:state.custom[id].subject,body:t,tags:[{t:"求人依頼",k:"green"},{t:"貼り付け",k:"gray"}],caseId:id,unread:true});
  state.folder="inbox";state.selMail="M"+id;bg.remove();render();toast("受信箱に追加しました");
 };
}

document.addEventListener("click",function(e){
 var t=e.target.closest("button,[data-pick]");if(!t)return;
 var ds=t.dataset;
 if(t.hasAttribute("data-close"))return;
 if(ds.view){go(ds.view);return}
 if(ds.folder){state.folder=ds.folder;var f=state.mails.filter(function(m){return m.folder===ds.folder})[0];state.selMail=f?f.id:null;render();return}
 if(ds.mail&&!ds.act){state.selMail=ds.mail;state.mails.forEach(function(m){if(m.id===ds.mail)m.unread=false});render();return}
 if(ds.case&&!ds.act&&!t.hasAttribute("data-pick")){state.selCase=ds.case;var st0=cs(ds.case);state.ptab=st0.extracted?(st0.step>=3?"doc":st0.step>=2?"cand":"cond"):"cond";render();return}
 if(ds.ptab){if(ds.ptab!=="mail"&&!cs(state.selCase).extracted&&ds.ptab!=="cond"){toast("先に求人票をつくってください");return}state.ptab=ds.ptab;if(ds.ptab==="doc"){var sd=cs(state.selCase);if(okIds(sd).length&&sd.step<3)sd.step=3}if(ds.ptab==="cand"){var s1=cs(state.selCase);if(s1.step<2)s1.step=2;if(!s1.picked.length){var c1=C(state.selCase);s1.picked=candidates(c1.cond).slice(0,3).map(function(r){return r.k.id})}}render();return}
 if(ds.post){state.selPost=ds.post;render();return}
 if(ds.ch){var sp=state.posts.filter(function(x){return x.id===state.selPost})[0];sp.ch=ds.ch;sp.text=null;render();return}
 if(ds.lang){state.lang=ds.lang;state.posts.forEach(function(x){if(x.status==="draft")x.text=null});render();return}
 switch(ds.act){
  case "help":help();break;
  case "cands":candsModal();break;
  case "reset":if(confirm("デモを最初の状態に戻しますか？")){state=fresh();render();toast("最初の状態に戻しました")}break;
  case "paste":pasteModal();break;
  case "gomail":var mm=state.mails.filter(function(m){return m.caseId===state.selCase&&m.folder==="inbox"})[0];if(mm){state.folder="inbox";state.selMail=mm.id}go("mail");break;
  case "toproposal":openCase(ds.case);break;
  case "extract":var st=cs(ds.case);t.disabled=true;t.innerHTML=IC.spark+"求人票をつくっています…";setTimeout(function(){st.extracted=true;st.step=1;state.ptab="cond";addPostFor(ds.case,"求人票から");render()},900);break;
  case "ask":ask(ds.case,ds.cand);break;
  case "askall":var st2=cs(ds.case);if(!st2.picked.length){toast("推薦に入れる候補者を選んでください");break}st2.picked.slice().forEach(function(id,i){setTimeout(function(){ask(ds.case,id)},i*300)});break;
  case "viewdoc":var c2=C(ds.case),st3=cs(ds.case);if(!okIds(st3).length){toast("応募意思を確認できた候補者がいません");break}modal(docHtml(c2,st3,true)+'<div class="actions" style="justify-content:flex-end"><button data-act="print">印刷・PDFで保存</button><button class="primary" data-close>閉じる</button></div>');break;
  case "print":window.print();break;
  case "attach":attachDoc(ds.case);break;
  case "insertdoc":var mi=state.mails.filter(function(x){return x.id===ds.mail})[0];attachDoc(mi.caseId);break;
  case "savedraft":var d=captureCompose(ds.mail);if(!d)break;var src=state.mails.filter(function(x){return x.id===ds.mail})[0];
   if(src.folder==="draft"){src.body=d.body;src.subject=d.subject;src.addr=d.to}else{state.mails.unshift({id:"M"+(++state.seq)+"d",folder:"draft",from:BRAND,addr:d.to,toName:src.from,init:BRAND.charAt(0),date:stamp(NOW,new Date().toTimeString().slice(0,5)),subject:d.subject,body:d.body,attach:d.attach,caseId:src.caseId,tags:[{t:"下書き",k:"amber"}]})}
   state.compose=null;render();toast("下書きに保存しました");break;
  case "send":sendMail(ds.mail);break;
  case "confirmint":confirmInterview(ds.case,state.selMail);break;
  case "regen":var sp2=state.posts.filter(function(x){return x.id===state.selPost})[0];sp2.v=(sp2.v||0)+1;sp2.text=null;render();break;
  case "schedule":var sp3=state.posts.filter(function(x){return x.id===state.selPost})[0];sp3.when=$("#slot").value;sp3.status="scheduled";sp3.text=postText(JOB(sp3.job),sp3.ch,state.lang,sp3.v);render();toast("予約しました："+sp3.when+"（"+({line:"LINE配信",facebook:"Facebook",linkedin:"LinkedIn"})[sp3.ch]+"）");break;
  case "unschedule":var sp4=state.posts.filter(function(x){return x.id===state.selPost})[0];sp4.status="draft";sp4.when="";render();break;
  case "postnow":var sp5=state.posts.filter(function(x){return x.id===state.selPost})[0];sp5.status="posted";sp5.when=stamp(NOW,new Date().toTimeString().slice(0,5));sp5.text=postText(JOB(sp5.job),sp5.ch,state.lang,sp5.v);render();toast("配信しました（デモのため、実際には配信していません）");break;
  case "newpost":var free=allCases().filter(function(c){return !state.posts.some(function(s){return s.job===c.id})})[0];if(!free){toast("配信していない求人はありません");break}var nid="S"+(++state.seq)+"n";state.posts.unshift({id:nid,job:free.id,status:"draft",ch:"facebook",when:"",auto:false});state.selPost=nid;render();break;
 }
});
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset.pick){var st=cs(t.dataset.case),id=t.dataset.pick;if(t.checked){if(st.picked.indexOf(id)<0)st.picked.push(id)}else st.picked=st.picked.filter(function(x){return x!==id});render();return}
 if(t.dataset.auto){state.auto[t.dataset.auto]=t.checked;save();return}
});
document.addEventListener("input",function(e){
 var t=e.target;if(t.id==="rBody"||t.id==="rTo"||t.id==="rSubj"){state.compose={mail:state.selMail,to:$("#rTo").value,subject:$("#rSubj").value,body:$("#rBody").value,attach:$("#replyBox").dataset.attach||null};save()}
});

render();
if(!state.seen){state.seen=true;save();help()}
})();
</script>
